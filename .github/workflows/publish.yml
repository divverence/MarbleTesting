name: publish

# Replaces the Jenkins/MyGet build: builds, tests and publishes to nuget.org with
# Trusted Publishing (OIDC), so no NuGet API key is stored anywhere.
on:
  push:
    branches: [ master, develop, 'release/*' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # nuget.org Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: windows-latest # the tests expect Windows line endings (\r\n)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-flow-version needs the history and the master/develop refs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Install git-flow-version
        run: dotnet tool install --global git-flow-version

      - name: Calculate version
        shell: pwsh
        run: |
          $version = git-flow-version --branch=${{ github.ref_name }} | ConvertFrom-Json
          $version | Format-List
          "FULLSEMVER=$($version.FullSemVer)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSEMBLYVERSION=$($version.AssemblyVersion)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create assembly info
        shell: pwsh
        run: |
          New-Item -ItemType Directory built -Force | Out-Null
          @"
          // <auto-generated/>
          using System.Reflection;
          [assembly: AssemblyVersionAttribute("$env:ASSEMBLYVERSION")]
          [assembly: AssemblyFileVersionAttribute("$env:ASSEMBLYVERSION")]
          [assembly: AssemblyInformationalVersionAttribute("$env:FULLSEMVER")]
          "@ | Out-File -Encoding utf8 built/SharedAssemblyInfo.cs -Force

      - name: Test
        run: dotnet test Divverence.MarbleTesting.sln --configuration Release

      - name: Pack
        run: dotnet pack Divverence.MarbleTesting.sln --configuration Release --output ./built /p:Version=${{ env.FULLSEMVER }}

      - name: NuGet login (OIDC, Trusted Publishing)
        id: nuget_login
        if: github.ref_name == 'master' || startsWith(github.ref_name, 'release/')
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'htibartdeboer' }}

      - name: Publish to nuget.org
        if: github.ref_name == 'master' || startsWith(github.ref_name, 'release/')
        run: dotnet nuget push ./built/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
